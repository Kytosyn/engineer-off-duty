    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { 
        height: 100%;

        overflow-x: hidden;

      #preloader {
        position: fixed;

        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        transition: opacity 0.6s ease;
      }
      #preloader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .preloader-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(96, 165, 250, 0.2);
        border-top-color: #60a5fa;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .preloader-text {
        margin-top: 20px;
        font-size: 12px;
        color: #60a5fa;
        letter-spacing: 3px;
        text-transform: uppercase;
        opacity: 0.8;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #root:empty::after {
        content: '';
        display: block;
        min-height: 100vh;
        background: #0f172a;
      }
