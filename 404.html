<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Engineer Off Duty</title>
  <script>
    // SPA redirect for GitHub Pages
    (function() {
      var path = window.location.pathname;
      // If not at root, redirect to root with hash
      if (path !== '/' && !path.includes('/engineer-off-duty/')) {
        window.location.href = '/engineer-off-duty/#' + path;
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
